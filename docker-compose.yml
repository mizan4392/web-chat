

services:
  
  backend:
    build: ./server
    container_name: web_chat_backend
    ports:
      - "5002:3000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
    networks:
      - app_network

  frontend:
    build: ./client
    container_name: web_chat_frontend
    ports:
      - "5003:5173"
    env_file:
      - ./client/.env
      
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app_network


networks:
  app_network: