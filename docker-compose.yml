

services:
  
  backend:
    build: ./server
    container_name: web_chat_backend
    ports:
      - "5002:3000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production

    networks:
      - shared-network


  frontend:
    build: ./client
    container_name: web_chat_frontend
    ports:
      - "5003:5173"
    env_file:
      - ./client/.env
      


  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"



networks:
  shared-network:
    external: true